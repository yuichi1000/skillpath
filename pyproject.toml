[project]
name = "skillpath"
version = "0.1.0"
description = "SkillPath — 技術学習ロードマップ自律エージェント (All Things Agentic Hackathon / Track: The Taskmaster)"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.0",
    "google-genai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "neo4j>=5.24",
    "pydantic>=2.8",
    "google-cloud-storage>=2.18",
    "google-cloud-firestore>=2.19",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-pubsub>=2.23",
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-gcp-trace>=1.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["llm: 実際の Gemini API を呼ぶテスト (make test では除外)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
