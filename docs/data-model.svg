<text x="350" y="667" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#7C6BF5" font-weight="700" text-anchor="start" letter-spacing="1.2">WHY THE GRAPH</text>
<text x="350" y="689" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4B3FBB" font-weight="400" text-anchor="start">A low mock-exam score is a symptom. The weakness</text>
<text x="350" y="705" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4B3FBB" font-weight="400" text-anchor="start">detector walks PREREQUISITE_OF up to 4 hops back to</text>
<text x="350" y="721" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4B3FBB" font-weight="400" text-anchor="start">the unmastered prerequisites behind it — and those</text>
<text x="350" y="737" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#4B3FBB" font-weight="400" text-anchor="start">become the review blocks. Plain chat cannot do this.</text>
<text x="32" y="822" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#98A1AC" font-weight="400" text-anchor="start">Every user-scoped query filters by uid; every write is a MERGE.</text>
